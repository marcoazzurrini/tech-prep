pre-commit:
  piped: true
  jobs:
    # Block secrets (API keys, tokens) before they are committed.
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,html,md,mdx,yml,yaml}"
      exclude:
        - bun.lock
        - "packages/starters/*/problems/**"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      exclude:
        - "packages/starters/*/problems/**"
      run: bunx oxlint --deny-warnings {staged_files}
    - name: typecheck
      run: bun run typecheck

pre-push:
  jobs:
    - name: test
      run: bun run test
